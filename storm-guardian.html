 const L=AC.sampleRate*1.8|0,ir=AC.createBuffer(2,L,AC.sampleRate);for(let c=0;c<2;c++){const o=ir.getChannelData(c);for(let i=0;i<L;i++)o[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.5)}
 const rv=AC.createConvolver(),rw=AC.createGain();rv.buffer=ir;rw.gain.value=.22;mg.connect(rw);rw.connect(rv);rv.connect(cm); // reverb: thunder and zaps ring inside the eye
 const ns=(f,q,ty)=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=b;s.loop=true;fl.type=ty;fl.frequency.value=f;fl.Q.value=q;gn.gain.value=0;s.connect(fl);fl.connect(gn);gn.connect(mg);s.start();return gn};
 rg=ns(3200,.5,'bandpass');rg.gain.value=.02;const wg=ns(420,.8,'bandpass'),lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=.13;lg.gain.value=.012;wg.gain.value=.022;lf.connect(lg);lg.connect(wg.gain);lf.start(); // rain hiss + swelling wind
 padG=AC.createGain();const pf=AC.createBiquadFilter();padG.gain.value=.04;pf.type='lowpass';pf.frequency.value=520;padG.connect(pf);pf.connect(mg);

addEventListener('keydown',e=>{audioInit();const k=e.key.toLowerCase();tip='';
 if(k==='p'||k===' '||k==='escape'){if(st==='play')st='pause';else if(st==='pause')st='play';e.preventDefault()}
 else if(st==='play'){if(k>='1'&&k<='6')sel=k-1;else if(k==='7'||k==='r')doUlt();else if(DEBUG&&k==='n'){wave+=5;wk=0}}
 else if(st==='boon'){if(k>='1'&&k<='3')takeBoon(k-1);else if(k==='r')reroll()}
 else if(k==='enter'&&(st==='title'||st==='over'))newRun()});
const autoPause=()=>{if(st==='play')st='pause'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause()});addEventListener('blur',autoPause);
function resize(){const d=window.devicePixelRatio||1;let s=Math.min(innerWidth*d/W,innerHeight*d/H);if(s>=2)s=Math.floor(s);cv.style.width=W*s/d+'px';cv.style.height=H*s/d+'px'}
addEventListener('resize',resize);

/* ===== 14. MAIN LOOP: fixed 60Hz step, capped dt ===== */
let last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.1,(ts-last)/1000||0);last=ts;acc+=dt;let n=0;
 while(acc>=1/60&&n<6){step(1/60);acc-=1/60;n++}if(n>=6)acc=0;draw();fc++;if(ts-ft>1000){fps=fc;fc=0;ft=ts}}
newRun();st='title';resize();requestAnimationFrame(frame);
</script></body></html>
